<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Style 3: Bold & Dramatic</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0A0A0A;
    font-family: 'Georgia', 'Times New Roman', serif;
    padding: 24px;
  }
  .card {
    max-width: 500px;
    width: 100%;
    padding: 24px;
  }
  .meta {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #C9A227;
    margin-bottom: 20px;
    font-weight: 700;
  }
  h1 {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    margin: 0 0 40px;
    line-height: 1.2;
  }
  .option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #333;
    padding: 22px 24px;
    margin-bottom: 16px;
    font-size: 18px;
    color: #EAEAEA;
    cursor: pointer;
    transition: all 0.2s;
    font-family: -apple-system, sans-serif;
  }
  .option:hover {
    border-color: #C9A227;
    background: rgba(201, 162, 39, 0.08);
    padding-left: 32px;
  }
  .option .arrow { color: #C9A227; font-size: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="meta">Question 03 — of 07</div>
    <h1>It's Saturday morning with nothing planned. What are you doing?</h1>
    <div class="option"><span>Chasing an adrenaline rush somewhere new</span><span class="arrow">→</span></div>
    <div class="option"><span>Staying in with a blanket and a good show</span><span class="arrow">→</span></div>
    <div class="option"><span>A quiet walk, just me and my thoughts</span><span class="arrow">→</span></div>
    <div class="option"><span>Still asleep, obviously</span><span class="arrow">→</span></div>
  </div>
</body>
</html>
