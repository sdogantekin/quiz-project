<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Style 1: Playful & Colorful</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 50%, #6BCB77 100%);
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 32px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    border: 6px solid #FFD93D;
  }
  .badge {
    display: inline-block;
    background: #FF6B6B;
    color: white;
    font-weight: 800;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 28px;
    color: #333;
    margin: 0 0 24px;
    line-height: 1.3;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFF9E6;
    border: 3px solid transparent;
    border-radius: 20px;
    padding: 16px 20px;
    margin-bottom: 14px;
    font-size: 17px;
    font-weight: 600;
    color: #444;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .option:hover {
    transform: scale(1.03) rotate(-1deg);
    border-color: #6BCB77;
    background: #EFFFF0;
  }
  .emoji { font-size: 24px; }
  .progress { display: flex; gap: 6px; margin-bottom: 24px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #eee; }
  .dot.active { background: #FF6B6B; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Question 3 of 7</div>
    <div class="progress">
      <div class="dot active"></div><div class="dot active"></div><div class="dot active"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <h1>It's Saturday morning with nothing planned. What are you doing?</h1>
    <div class="option"><span class="emoji">🏔️</span> Chasing an adrenaline rush somewhere new</div>
    <div class="option"><span class="emoji">🛋️</span> Staying in with a blanket and a good show</div>
    <div class="option"><span class="emoji">🧘</span> A quiet walk, just me and my thoughts</div>
    <div class="option"><span class="emoji">🌙</span> Still asleep, obviously</div>
  </div>
</body>
</html>
